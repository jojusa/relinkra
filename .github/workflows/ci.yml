# R5B - continuous integration for the relinkra repository.
#
# Trust model: minimal top-level permissions, no untrusted triggers, no
# secrets, every action pinned to a major tag. tests/test_ci_hygiene.py
# enforces this contract; keep it in sync when editing this file.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: fast / ubuntu / py3.14
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Byte-compile the package and the tools
        run: python -m compileall -q relinkra tools
      # One run step per fast suite so a failure points at its suite.
      - name: packaging contract tests
        run: >-
          python -W error::ResourceWarning -m unittest discover -s tests
          -p "test_packaging.py" -q
      - name: core runner tests
        run: >-
          python -W error::ResourceWarning -m unittest discover -s tests
          -p "test_tools_core_runner.py" -q
      - name: release gate tests
        run: >-
          python -W error::ResourceWarning -m unittest discover -s tests
          -p "test_release_gates.py" -q
      - name: platform honesty tests
        run: >-
          python -W error::ResourceWarning -m unittest discover -s tests
          -p "test_platform_honesty.py" -q
      - name: CI hygiene audits
        run: >-
          python -W error::ResourceWarning -m unittest discover -s tests
          -p "test_ci_hygiene.py" -q

  core:
    name: core / ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Explicit include list, NOT an os x python cross-product:
      # - ubuntu covers the full supported floor-to-current range;
      # - windows covers floor + current (CBM is certified windows-amd64
      #   only; off-Windows cells assert the honest WARN path);
      # - macOS avoids 3.9 (arm64 runner availability risk).
      # The 3.9/3.10 cells verify the Codex TOML connector FAIL_HONEST
      # path via the existing test suite (tomllib exists from 3.11).
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.9" }
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: ubuntu-latest, python: "3.14" }
          - { os: windows-latest, python: "3.9" }
          - { os: windows-latest, python: "3.14" }
          - { os: macos-latest, python: "3.11" }
          - { os: macos-latest, python: "3.14" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install the package (isolated PEP 517 build)
        run: python -m pip install .
      - name: Installed CLI smoke
        shell: bash
        # Runs from a throwaway directory: proves the INSTALLED console
        # scripts work outside the source tree on this exact interpreter.
        run: |
          set -euo pipefail
          smoke_dir="$(mktemp -d)"
          cd "$smoke_dir"
          relinkra --version
          relinkra version --json
          relinkra --help > /dev/null
          git init -q smoke-repo && cd smoke-repo
          git config user.email ci@example.invalid
          git config user.name CI
          # `relinkra init` requires a resolvable project identity, and a
          # repository with zero commits honestly cannot provide one
          # (FAIL_HONEST by design). The smoke must therefore bootstrap a
          # deterministic initial commit — the scenario under test is a
          # REAL repository, not a commit-less one. tests/test_ci_hygiene.py
          # pins this ordering.
          git commit --allow-empty -qm "smoke bootstrap"
          relinkra init --json
          relinkra doctor --json > doctor-report.json
          test -s doctor-report.json
      - name: Core test suite
        # The installability of the package is proven by the pip install
        # and the CLI smoke above; this suite runs from the checkout, so
        # `import relinkra` inside the tests resolves to the CHECKOUT copy
        # (repo root precedes site-packages on sys.path) and repo-relative
        # fixtures resolve to the checkout. Both facts are intentional.
        run: python -W error::ResourceWarning tools/run_core_tests.py

  full-regression:
    name: full-regression / ${{ matrix.os }} / py3.14
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Each cell carries a canonical platform label used to name the
      # run-scoped evidence fragment it emits (R5C).
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux }
          - { os: windows-latest, platform: windows }
          - { os: macos-latest, platform: macos }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      # Canonical full regression per R5B.10: 0 failures, 0 errors, 0
      # ResourceWarnings — the emitter promotes ResourceWarning to error
      # in-process, mirroring release_check.run_regression. The E2E suites
      # inside build real artifacts (with network) when
      # RELINKRA_E2E_ARTIFACT is not set.
      # R5C: each cell emits a run-scoped evidence fragment bound to
      # github.sha + github.run_id and exits non-zero on suite failure.
      - name: Full test suite (emits run-scoped evidence)
        run: >-
          python tools/emit_run_evidence.py --run-regression
          --platform ${{ matrix.platform }}
          --job full-regression
          --sha ${{ github.sha }}
          --run-id ${{ github.run_id }}
          --runner-os ${{ matrix.os }}
          --out run-evidence-${{ matrix.platform }}.json
      # Uploaded even when the suite failed: a passed=false fragment is
      # evidence, not noise. Ephemeral on purpose — run-scoped evidence
      # is never committed and expires with the run.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: run-evidence-${{ matrix.platform }}
          path: run-evidence-${{ matrix.platform }}.json
          retention-days: 1
          if-no-files-found: error

  release-readiness:
    name: release-readiness
    needs: [fast, core, full-regression]
    # always(): the readiness report must also be computed — honestly
    # degraded — when an upstream job failed or was cancelled.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      # R5C run-scoped evidence: full-regression cells upload SHA-bound
      # fragments (github.sha + github.run_id, retention-days: 1, never
      # committed). They are downloaded unmerged so duplicate-platform
      # fragments stay detectable, then composed into one evidence map.
      - uses: actions/download-artifact@v7
        with:
          pattern: run-evidence-*
          path: run-evidence/
      - name: Compose run-scoped evidence
        shell: bash
        env:
          FAST_RESULT: ${{ needs.fast.result }}
          CORE_RESULT: ${{ needs.core.result }}
          FULL_REGRESSION_RESULT: ${{ needs.full-regression.result }}
        # Exit 2 (malformed/stale/cross-run/duplicate/anomalous fragment)
        # fails the job honestly. A fragment missing because its cell did
        # not succeed composes a DEGRADED report instead: the platform key
        # is omitted (gate PARTIAL) and remote_runs_passed is false.
        run: |
          set -euo pipefail
          python tools/compose_run_evidence.py \
            --evidence-dir run-evidence \
            --require-sha "${{ github.sha }}" \
            --run-id "${{ github.run_id }}" \
            --upstream "fast=${FAST_RESULT}" \
            --upstream "core=${CORE_RESULT}" \
            --upstream "full-regression=${FULL_REGRESSION_RESULT}" \
            --out composed-evidence.json
      # release_check --run-packaging builds the sdist through the PEP
      # 517 setuptools hook, which needs setuptools/build importable on
      # a bare setup-python interpreter.
      - name: Install packaging prerequisites
        run: python -m pip install build setuptools
      # The report is bound to THIS run's commit: --require-sha rejects
      # evidence that does not carry meta.sha == github.sha before any
      # gate is evaluated. release_check exits 0 when the report was
      # computed, even with PARTIAL/BLOCKED gates; no --require is
      # asserted here.
      - name: Compute the release gate report
        shell: bash
        run: |
          set -euo pipefail
          python tools/release_check.py \
            --evidence composed-evidence.json \
            --require-sha "${{ github.sha }}" \
            --run-packaging --json > release-report.json
          cat release-report.json
      - name: Append the human gate summary
        shell: bash
        run: |
          {
            echo "## Release gate summary"
            echo '```text'
            python tools/release_check.py \
              --evidence composed-evidence.json \
              --require-sha "${{ github.sha }}" --run-packaging
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # if: always(): the report artifact must exist even on degraded
      # runs so the gate evidence stays inspectable after failures.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-report
          path: release-report.json
          retention-days: 30
