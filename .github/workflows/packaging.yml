# R5B - packaging verification: build the artifacts once, then install
# the EXACT built artifacts on every supported platform.
#
# Same trust model as ci.yml: minimal permissions, no untrusted triggers,
# no secrets, pinned actions (enforced by tests/test_ci_hygiene.py).
name: Packaging

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packaging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: package / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          # The pip cache keys on OS + python + pyproject; it never caches
          # the built relinkra tree itself.
          cache: pip
      - name: Record the build revision
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          run_sha="${{ github.sha }}"
          if [ "$head_sha" != "$run_sha" ]; then
            echo "checked-out revision $head_sha does not match the run revision $run_sha" >&2
            exit 1
          fi
          echo "build revision: $head_sha"
          printf '%s\n' "$head_sha" > build-revision.txt
      - name: Install the build frontend
        run: python -m pip install --upgrade build
      # Produces dist/relinkra-<version>-py3-none-any.whl and
      # dist/relinkra-<version>.tar.gz (version single-sourced in
      # relinkra/__init__.py).
      - name: Build the wheel and the sdist
        run: python -m build
      # Content contract + sha256 digests; pipefail keeps the inspector's
      # exit code authoritative through tee (a masked failure here would be
      # a false green artifact gate).
      - name: Inspect artifacts
        shell: bash
        run: |
          set -euo pipefail
          python tools/artifact_checks.py dist/*.whl dist/*.tar.gz | tee artifact-report.json
      - name: Record artifact digests
        shell: bash
        run: cd dist && sha256sum * | tee ../SHA256SUMS.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relinkra-dist
          path: |
            dist/
            SHA256SUMS.txt
            artifact-report.json
            build-revision.txt
          retention-days: 30
          if-no-files-found: error

  wheel-install:
    name: package / wheel / ${{ matrix.os }} / py${{ matrix.python }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.9" }
          - { os: ubuntu-latest, python: "3.14" }
          - { os: windows-latest, python: "3.9" }
          - { os: windows-latest, python: "3.14" }
          - { os: macos-latest, python: "3.11" }
          - { os: macos-latest, python: "3.14" }
    steps:
      # The checkout is required: the E2E harness lives in tests/.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: relinkra-dist
          path: artifacts/
      - name: Verify the build revision
        shell: bash
        run: |
          set -euo pipefail
          artifact_sha="$(cat artifacts/build-revision.txt)"
          run_sha="${{ github.sha }}"
          if [ "$artifact_sha" != "$run_sha" ]; then
            echo "artifact revision $artifact_sha does not match the run revision $run_sha" >&2
            exit 1
          fi
          echo "artifact revision: $artifact_sha"
      # Installs the EXACT artifact produced by the build job, never a
      # rebuild. upload-artifact preserves the dist/ directory under the
      # least common ancestor, so the wheel lands at
      # artifacts/dist/*.whl. artifact_checks.py searches recursively,
      # requires one exact expected filename, and verifies the build job's
      # SHA256SUMS.txt before returning a native absolute path. The harness sandboxes
      # HOME/USERPROFILE/APPDATA/XDG_CONFIG_HOME/CODEX_HOME and proves
      # source-tree independence.
      - name: Select the downloaded wheel
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(python tools/artifact_checks.py --select wheel --artifact-dir artifacts --checksum-manifest artifacts/SHA256SUMS.txt)"
          echo "RELINKRA_E2E_ARTIFACT=$wheel" >> "$GITHUB_ENV"
          echo "wheel under test: $wheel"
      - name: Wheel install E2E
        run: python -W error::ResourceWarning -m unittest discover -s tests -p "test_install_e2e.py" -q

  sdist-install:
    name: package / sdist / ${{ matrix.os }} / py${{ matrix.python }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.9" }
          - { os: ubuntu-latest, python: "3.14" }
          - { os: windows-latest, python: "3.14" }
          - { os: macos-latest, python: "3.14" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: relinkra-dist
          path: artifacts/
      - name: Verify the build revision
        shell: bash
        run: |
          set -euo pipefail
          artifact_sha="$(cat artifacts/build-revision.txt)"
          run_sha="${{ github.sha }}"
          if [ "$artifact_sha" != "$run_sha" ]; then
            echo "artifact revision $artifact_sha does not match the run revision $run_sha" >&2
            exit 1
          fi
          echo "artifact revision: $artifact_sha"
      # pip builds from the sdist artifact itself (PEP 517 isolated),
      # proving the sdist is self-sufficient. The selector applies the
      # same recursive identity and checksum contract as the wheel job.
      - name: Select the downloaded sdist
        shell: bash
        run: |
          set -euo pipefail
          sdist="$(python tools/artifact_checks.py --select sdist --artifact-dir artifacts --checksum-manifest artifacts/SHA256SUMS.txt)"
          echo "RELINKRA_E2E_ARTIFACT=$sdist" >> "$GITHUB_ENV"
          echo "sdist under test: $sdist"
      - name: Sdist install E2E
        run: python -W error::ResourceWarning -m unittest discover -s tests -p "test_sdist_install_e2e.py" -q
